<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chron'O — maquette</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#163628;--mint:#3DDC97;--orange:#D9650C;--page:#F5F8F4;--line:#D3DDD6;--soft:#E3EEE6;--txt2:#4A5D52;--txt3:#7A8C81}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);font-family:'IBM Plex Sans',sans-serif;color:var(--forest);font-size:14px}
svg text{font-family:'IBM Plex Sans',sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.m{font-size:12px;color:var(--txt2)}
/* cadre */
#app{position:relative;min-width:1100px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.x-hd{background:var(--forest);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.x-tabsrow{display:flex;align-items:center;padding:10px 16px 0;gap:12px;flex-shrink:0;position:relative;z-index:3;background:var(--page)}
.x-tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.x-tab{padding:7px 15px;border-radius:999px;font-weight:500;cursor:pointer;color:#2F4A3B;white-space:nowrap}
.x-tab.on{background:var(--forest);color:#fff;font-weight:600}
.x-direct{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;font-weight:600;cursor:pointer;background:var(--soft)}
.x-direct.on{background:var(--forest);color:#fff}
.live{width:9px;height:9px;border-radius:50%;background:var(--mint);display:inline-block;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:br 2s infinite}
@keyframes br{0%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.x-body{flex:1;min-height:0;overflow:auto;padding:10px 16px 0}
.x-band{flex-shrink:0;margin:0 16px;padding:9px 4px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px}
.x-spacer{height:62px;flex-shrink:0}
/* boutons et statuts */
.b{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:#fff;color:var(--forest);box-shadow:0 0 0 1px #C9D6CE,0 1px 2px rgba(22,54,40,.08);border:none;font-family:inherit}
.b:hover{box-shadow:0 0 0 1.5px var(--forest)}
.b.p{background:var(--orange);color:#fff;box-shadow:none}.b.p:hover{background:#C2570A}
.b.sm{padding:4px 9px;font-size:12px}
.b.q{background:transparent;box-shadow:none;text-decoration:underline;padding:4px 6px}
.b.red{color:#D92D20}
.bd{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.ok{color:#17663A;background:#DDF3E5}.cur{color:#0B6B5A;background:#D3F5EC}.vf{color:#6B5200;background:#FFF1B8}.pb{color:#D92D20;background:#FDE4E1}.gr{color:#4F5A63;background:#ECEFF1}
.chip{font-size:12px;color:#2F4A3B;background:var(--soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.sq{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}
/* zone de réglages */
.x-zone{background:var(--page);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;display:inline-block;max-width:100%}
.x-zl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.x-zex{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding:10px 0 4px 6px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 0 0 1px var(--line)}.seg span{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;color:#2F4A3B}.seg .o{background:var(--forest);color:#fff}
.tog{width:36px;height:20px;border-radius:999px;display:inline-block;position:relative;cursor:pointer;vertical-align:middle;flex-shrink:0}.tog span{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.val{display:inline-block;padding:5px 10px;border-radius:8px;background:#F0F5F1;font-size:13px}
.x-alert{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 0 0 2px #E0281B}
/* gabarits */
.x-toprow{display:flex;align-items:flex-start;gap:12px}
.x-list{display:grid;grid-template-columns:270px 1fr;gap:14px;margin-top:12px}
.x-card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px #E3EAE5}
.x-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.x-search{flex:0 0 260px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--txt3);font-size:13px}
.x-search input{border:none;outline:none;font:inherit;color:var(--forest);flex:1;background:transparent}
table.x-t{width:100%;border-collapse:collapse;font-size:13px}
.x-t th{font-size:11.5px;font-weight:600;color:var(--txt2);text-align:left;padding:10px 10px 6px;white-space:nowrap;cursor:pointer;user-select:none}
.x-t td{padding:8px 10px;border-top:1px solid #EEF2EF;white-space:nowrap}
.x-t tr.r:hover td{background:#F7FAF8;cursor:pointer}
.x-t tr.sel td{background:#E8F0EA}
.x-t tr.todo td{background:#FFF7F0}
.x-t td.fiche{background:#F7FAF8;white-space:normal;padding:12px 14px;border-top:none}
.x-panel{padding:12px 14px}
.x-pt{font-weight:700;font-size:13px;margin-bottom:6px}
/* encart lecteur */
.tile{display:flex;align-items:center;gap:12px;border-radius:16px;padding:11px 14px;background:var(--forest);color:#fff;box-shadow:0 6px 16px rgba(22,54,40,.18)}
.tile.pris{background:#DDE4E9;color:#39434B;box-shadow:none;cursor:pointer}
.tg{position:relative;width:40px;height:40px;flex-shrink:0}.tg svg{position:relative;width:40px;height:40px}
.wave{position:absolute;inset:0;border-radius:50%;border:3px solid #7EE0A6;animation:wv 2.4s ease-out infinite}
@keyframes wv{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
/* atelier */
.x-atel{display:grid;grid-template-columns:250px 1fr 250px;gap:14px;margin-top:12px;align-items:start}
.x-it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.x-it:hover{background:#F2F6F3}.x-it.on{background:var(--forest);color:#fff}.x-it.on .m{color:#9FD9B8}
.tag:hover rect{fill:#F6E3F2}
/* bulle */
.x-pop{position:absolute;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(22,54,40,.08),0 18px 44px rgba(22,54,40,.25);z-index:30}
.x-pop .arr{position:absolute;top:-8px;width:16px;height:16px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(22,54,40,.08)}
.sec{padding:12px 16px}.sec+.sec{border-top:1px solid #EEF2EF}
.st2{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--txt3);text-transform:uppercase;display:flex;align-items:center;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0}.row+.row{border-top:1px solid #F3F6F4}
.pin{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.x-ind{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* tiroir Direct */
#dr{position:absolute;left:0;right:0;bottom:0;z-index:20;transition:top .6s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column}
#dr.hide{display:none}
.x-bar{background:var(--forest);color:#fff;border-radius:20px 20px 0 0;padding:6px 16px 10px;cursor:pointer;box-shadow:0 -10px 30px rgba(15,26,20,.25);flex-shrink:0}
.x-hdl{width:44px;height:5px;border-radius:3px;background:#4C7360;margin:0 auto 5px;transition:opacity .4s}
.dr-open .x-hdl{opacity:0}
.x-pill{display:inline-flex;align-items:center;gap:6px;background:#1F4A37;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.fade{transition:opacity .45s,max-width .45s;overflow:hidden;white-space:nowrap}
.dr-open .cl{opacity:0;max-width:0}
.x-r2{max-height:0;overflow:hidden;transition:max-height .6s}
.dr-open .x-r2{max-height:330px}
.x-drbody{flex:1;min-height:0;overflow:auto;background:var(--page);padding:12px 16px}
.x-drain{height:3px;background:var(--mint);border-radius:2px;transition:width linear}
/* téléphone de diffusion etc. : écrans publics */
.tv{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 0 0 4px #1A1A1A}
.scr{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;padding:30px 44px;display:flex;flex-direction:column}
.lb{font-size:24px;opacity:.8;font-weight:500}
.dn{display:flex;align-items:center;gap:16px;font-size:44px;padding:10px 0;border-top:1px solid rgba(255,255,255,.15)}
.cat{font-size:24px;opacity:.75;margin-left:auto}.cc{width:18px;height:18px;border-radius:50%;display:inline-block;flex-shrink:0}
.st{width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:700;flex-shrink:0}
.band{background:#fff;border-radius:16px;padding:12px 18px 4px}
.cc2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
.bt{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bt.bs,.bt.bw{background:#fff;color:var(--forest);box-shadow:0 0 0 1px #C9D6CE,0 1px 2px rgba(22,54,40,.08)}
.x-modal{position:absolute;inset:0;background:rgba(15,26,20,.35);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:30px;overflow:auto}
.x-ctl{position:fixed;left:14px;bottom:128px;z-index:60;display:flex;gap:6px;background:rgba(255,255,255,.95);padding:6px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:12px}
.h-top{background:var(--forest);color:#fff;padding:12px 24px;display:flex;align-items:center;flex-shrink:0}
.h-logo{display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.3px}
.h-scroll{flex:1;overflow:auto}
.h-hero{position:relative;height:400px;overflow:hidden;border-bottom:1px solid var(--line)}
.h-hero .hm{position:absolute;inset:0}
.h-card{position:absolute;left:max(24px,calc(50% - 560px));top:50%;transform:translateY(-50%);width:400px;background:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 18px 40px rgba(22,54,40,.18)}
.h-card h2{font-size:34px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.6px}
.h-cols{max-width:1120px;margin:0 auto;padding:28px 24px 60px;display:grid;grid-template-columns:1fr 340px;gap:36px}
.h-st{display:flex;align-items:center;margin-bottom:12px}.h-st h3{font-size:20px;margin:0}
.h-tl{position:relative}
.h-lab{font-size:13px;font-weight:600;color:var(--txt2);padding-left:92px;margin-bottom:4px}
.h-ev{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 0;border-radius:12px;cursor:pointer;position:relative}
.h-ev:hover{background:#fff;box-shadow:0 0 0 1px #E3EAE5}
.h-date{width:62px;text-align:right;font-size:12px;color:var(--txt2);line-height:1.1;flex-shrink:0}.h-date span{display:block;font-size:24px;font-weight:700;color:var(--forest)}
.h-dot{width:14px;height:14px;border-radius:50%;border:2.6px solid #B5179E;background:#fff;flex-shrink:0;position:relative}
.h-ev+.h-ev .h-dot:before{content:'';position:absolute;left:3.4px;bottom:14px;width:2.4px;height:34px;background:#B5179E;opacity:.35}
.h-club{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 0 0 1px #E3EAE5}
.course line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .45s ease-out forwards}
.course>g,.course>path,.course>circle{opacity:0;animation:pop .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.course>g,.course>path,.course>circle{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.course line,.course>g,.course>path,.course>circle{animation:none;opacity:1;stroke-dashoffset:0}}
.course line:nth-of-type(1){animation-delay:0.57s}.course line:nth-of-type(2){animation-delay:0.89s}.course line:nth-of-type(3){animation-delay:1.21s}.course line:nth-of-type(4){animation-delay:1.53s}.course line:nth-of-type(5){animation-delay:1.85s}.course line:nth-of-type(6){animation-delay:2.17s}.course line:nth-of-type(7){animation-delay:2.49s}.course line:nth-of-type(8){animation-delay:2.81s}.course line:nth-of-type(9){animation-delay:3.13s}.course>g:nth-of-type(n){animation-delay:.2s}.course>g:nth-of-type(1){animation-delay:0.82s}.course>g:nth-of-type(2){animation-delay:1.14s}.course>g:nth-of-type(3){animation-delay:1.46s}.course>g:nth-of-type(4){animation-delay:1.78s}.course>g:nth-of-type(5){animation-delay:2.10s}.course>g:nth-of-type(6){animation-delay:2.42s}.course>g:nth-of-type(7){animation-delay:2.74s}.course>g:nth-of-type(8){animation-delay:3.06s}.course>g:nth-of-type(9){animation-delay:3.38s}.course>g:nth-of-type(10){animation-delay:3.70s}.course>g:nth-of-type(11){animation-delay:4.02s}.course>path{animation-delay:.1s}.course>circle{animation-delay:3.2s}
/*grp*/.h-grp{position:absolute;left:max(24px,calc(50% - 560px));top:50%;transform:translateY(-50%);display:flex;align-items:stretch}.h-grp .h-live{overflow:hidden;margin:16px 0;padding-top:12px;padding-bottom:12px}
.h-grp .h-card{position:relative;left:auto;top:auto;transform:none;z-index:2;flex-shrink:0}
.h-grp .h-live{position:relative;right:auto;top:auto;transform:none;z-index:1;margin-left:-30px;padding-left:48px;border-radius:0 20px 20px 0}
/*live*/.h-live{position:absolute;right:max(24px,calc(50% - 560px));top:50%;transform:translateY(-50%);width:340px;background:var(--forest);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 18px 40px rgba(22,54,40,.3)}
body.mob{background:#DDE5DF}body.mob #app{width:390px;height:844px;min-width:0;margin:56px auto 20px;border-radius:38px;box-shadow:0 0 0 10px #1A1A1A,0 30px 60px rgba(0,0,0,.25);background:var(--page)}
body.mob .x-search{flex:1 1 auto}.x-ctl,.x-ctl *{white-space:nowrap;align-items:center}.x-ctl .b{padding:4px 9px;font-size:12px}body.mob .h-cols{display:block}
/* bulle variante B */
.pv-c{position:absolute;inset:0;z-index:55}
.pv-b{position:absolute;z-index:56;background:#fff;box-shadow:0 0 0 1px rgba(22,54,40,.1),0 16px 40px rgba(22,54,40,.24);text-align:left;white-space:normal}
.pv-t{position:absolute;z-index:57;background:#fff;color:var(--forest);box-shadow:0 0 0 1px rgba(22,54,40,.1);cursor:pointer;white-space:nowrap}
.pv-t .i{color:var(--forest)}
.pv-i{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;font-size:13px;cursor:pointer}.pv-i:hover{background:#F0F5F1}.pv-i.red{color:#D92D20}.pv-i .i{margin-top:1px}
/* fiche modifiable sur place */
.flg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--txt2)}
.fl input,.fl select{height:34px;border-radius:9px;border:none;background:#fff;box-shadow:0 0 0 1px #D3DDD6;padding:0 10px;font:inherit;font-size:14px;color:var(--forest);font-weight:600;min-width:0;width:100%}
.fl input:hover,.fl select:hover{box-shadow:0 0 0 1.5px var(--forest)}.fl input:focus,.fl select:focus{outline:none;box-shadow:0 0 0 2px var(--forest)}
.ptag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 7px;border-radius:7px;box-shadow:inset 0 0 0 1.6px #B5179E;color:#B5179E;font-weight:700;font-size:13px;background:#fff;cursor:pointer}
.ptag.on{background:#F6E3F2;box-shadow:inset 0 0 0 2.2px #B5179E}.ptag.free{color:#C98BBE;box-shadow:inset 0 0 0 1.4px #D9A6CF;border:none;background-image:none;outline:1.4px dashed #D9A6CF;outline-offset:-1.4px;box-shadow:none}.ptag.neu{text-decoration:line-through;box-shadow:inset 0 0 0 1.6px #B5179E,0 0 0 4px rgba(240,124,26,.45)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2.4px solid;font-size:12px;font-weight:700;color:var(--forest);background:#fff}
.x-t tr.tsel td{background:#FDF3FB}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:#fff;box-shadow:0 0 0 1px #D3DDD6;font-size:13px;font-weight:600;cursor:pointer}.opt:hover{box-shadow:0 0 0 1.5px var(--forest)}.opt.on{background:var(--forest);color:#fff;box-shadow:none}.opt.on .m{color:#9FD9B8}
.x-ind.rnd{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}.x-ind.rnd:hover{background:rgba(255,255,255,.24)}
.sbt{padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;color:#A9D8BD;cursor:pointer;white-space:nowrap}.sbt:hover{color:#fff}.sbt.on{background:#2E5A45;color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.m-subs{display:flex;gap:4px;margin:6px 10px 0;padding:3px;background:#fff;border-radius:999px;box-shadow:0 0 0 1px #DCE6DF;flex-shrink:0}
.ms{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--txt2);cursor:pointer}.ms.g{flex:0 0 40px}.ms.on{background:#2E5A45;color:#fff;font-weight:600}
.sr{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #EEF2EF;font-size:13px}body.mob .sr{flex-wrap:wrap;gap:8px}body.mob .sr>div:last-child{justify-content:flex-start!important}body.mob .sr>div:first-child{flex:1 1 180px!important;min-width:180px!important}
body.mob .m-hd,body.mob .m-top{max-height:90px;overflow:hidden;transition:max-height .3s,opacity .25s,padding .3s;flex-shrink:0}
body.mob #main.coll .m-hd,body.mob #main.coll .m-top{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.x-zone.zb{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.x-zone.zb:hover{border-color:#163628}
.x-zone.zm{display:flex;width:100%;padding:6px}.zsum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zex2{display:flex;flex-direction:column;align-items:flex-start;gap:12px;font-size:13px}.zex2>span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
body.mob.real{background:var(--page)}body.mob.real #app{width:100vw;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none}
body.real .x-ctl{bottom:120px;left:8px;max-width:calc(100vw - 16px);flex-wrap:wrap}
</style></head><body>
<h1 class="sr-only">Maquette utilisable de Chron'O : onglets, bulle Matériel, tiroir Direct, fenêtre Diffuser.</h1>
<div id="app"><div id="main" style="display:flex;flex-direction:column;height:100%"></div><div id="dr" class="hide"></div><div id="ov"></div></div>
<div class="x-ctl" id="ctl"></div>
<script>
/* bouton Réglages : icône seule, au début de la zone ; vert forêt plein quand déplié */

/* Représentation CO des postes et circuits — violine partout */
var VIO='#B5179E',VIOL='#F6E3F2';
/* épaisseur proportionnelle à la taille du rond */
function swR(r){return Math.max(1.1,Math.min(3.6,r*0.18))}
/* étiquette du code : taille et position (pos = 'below' | 'right' | angle en radians) */
function tagBox(x,y,r,code,pos){var th=Math.max(17,r*1.45),fs=Math.max(11,r*1.0),tw=String(code).length*fs*0.62+fs*0.9,g=Math.max(2,r*0.2),cx,cy;
if(pos==='below'){cx=x;cy=y+r+g+th/2}else if(pos==='right'){cx=x+r+g+tw/2;cy=y}
else{var a=(typeof pos==='number')?pos:-0.8,c=Math.cos(a),s=Math.sin(a),d=r+g+Math.abs(c)*tw/2+Math.abs(s)*th/2;cx=x+c*d;cy=y+s*d}
return {x:cx-tw/2,y:cy-th/2,w:tw,h:th,fs:fs,cx:cx,cy:cy}}
function svgPoste(x,y,n,code,o){o=o||{};var r=o.r||14,c=o.libre?'#9AA59E':(o.miss?'#D92D20':VIO),sw=swR(r)*(o.libre?0.65:1),g='';
if(o.sel)g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+r*0.55)+'" fill="#D9650C" opacity=".2"/>';
g+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+(o.fill||'#fff')+'" fill-opacity="'+(o.fill?1:.75)+'" stroke="'+c+'" stroke-width="'+sw+'"'+(o.libre||o.miss?' stroke-dasharray="'+(r*0.3)+' '+(r*0.22)+'"':'')+'/>';
if(n!==null&&n!==undefined&&!o.libre)g+='<text x="'+x+'" y="'+(y+r*0.36)+'" text-anchor="middle" font-size="'+Math.round(r*1.0)+'" font-weight="700" fill="'+c+'">'+n+'</text>';
if(code!==null&&code!==undefined){var t=tagBox(x,y,r,code,o.pos);
var ed=(o.edit!==undefined&&o.edit!==null),shown=ed?o.edit:code;if(ed){t=tagBox(x,y,r,String(code).length>String(shown).length?code:(shown||'0'),o.pos);t.w+=t.fs*0.5}
g+='<g'+(o.tagClick?' class="tag" style="cursor:text" onclick="event.stopPropagation();'+o.tagClick+'"':'')+'><title>'+(o.tagClick?'Code du poste : cliquer pour le changer':'Code du poste')+'</title><rect x="'+t.x+'" y="'+t.y+'" width="'+t.w+'" height="'+t.h+'" rx="'+(t.h*0.3)+'" fill="'+(ed?VIOL:'#fff')+'" stroke="'+c+'" stroke-width="'+(ed?Math.max(2,sw):Math.max(1.3,sw*0.75))+'"/>'+(ed?'<rect x="'+(t.x-3)+'" y="'+(t.y-3)+'" width="'+(t.w+6)+'" height="'+(t.h+6)+'" rx="'+(t.h*0.3+3)+'" fill="none" stroke="'+c+'" stroke-opacity=".3" stroke-width="3"/>':'')+'<text x="'+t.cx+'" y="'+(t.cy+t.fs*0.36)+'" text-anchor="middle" font-size="'+Math.round(t.fs)+'" font-weight="700" fill="'+c+'">'+shown+(ed?'<tspan class="caret" font-weight="400">|</tspan>':'')+'</text></g>'}
return g}
/* départ : triangle, pointe orientée vers le premier poste (to = [x,y]) */
function svgDepart(x,y,r,c,to){r=r||15;c=c||VIO;var deg=to?Math.atan2(to[1]-y,to[0]-x)*180/Math.PI+90:0;
return '<path transform="rotate('+deg.toFixed(1)+' '+x+' '+y+')" d="M'+x+' '+(y-r)+' L'+(x+r*0.87)+' '+(y+r*0.5)+' L'+(x-r*0.87)+' '+(y+r*0.5)+'Z" fill="none" stroke="'+c+'" stroke-width="'+swR(r)+'" stroke-linejoin="round"/>'}
function svgArrivee(x,y,r,c){r=r||14;c=c||VIO;return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="'+swR(r)+'"/><circle cx="'+x+'" cy="'+y+'" r="'+(r*0.62)+'" fill="none" stroke="'+c+'" stroke-width="'+swR(r)+'"/>'}
function svgTrait(a,b,ra,rb,c,sw){var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/L,uy=dy/L;return '<line x1="'+(a[0]+ux*ra)+'" y1="'+(a[1]+uy*ra)+'" x2="'+(b[0]-ux*rb)+'" y2="'+(b[1]-uy*rb)+'" stroke="'+(c||VIO)+'" stroke-width="'+(sw||swR(Math.max(ra,rb,10))*0.92)+'" stroke-linecap="round"/>'}
/* carte : place chaque étiquette le plus loin possible des traits, ronds et autres étiquettes */
function distSeg(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy,t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));var x=a[0]+t*dx-p[0],y=a[1]+t*dy-p[1];return Math.sqrt(x*x+y*y)}
function placeTags(items,segs,r,obst){obst=obst||[];/* items: [{x,y,code}] ; renvoie un angle par item */
var placed=[],res=[];for(var i=0;i<items.length;i++){var it=items[i],best=-1,ba=-0.8;
for(var k=0;k<16;k++){var a=-Math.PI+k*Math.PI/8,t=tagBox(it.x,it.y,r,it.code,a),pts=[[t.cx,t.cy],[t.x,t.y],[t.x+t.w,t.y],[t.x,t.y+t.h],[t.x+t.w,t.y+t.h]],m=1e9;
for(var q=0;q<pts.length;q++){var p=pts[q];
for(var j=0;j<segs.length;j++)m=Math.min(m,distSeg(p,segs[j][0],segs[j][1]));
for(j=0;j<items.length;j++)if(j!==i){var dx=p[0]-items[j].x,dy=p[1]-items[j].y;m=Math.min(m,Math.sqrt(dx*dx+dy*dy)-r)}
for(j=0;j<obst.length;j++){var ox=p[0]-obst[j][0],oy=p[1]-obst[j][1];m=Math.min(m,Math.sqrt(ox*ox+oy*oy)-r*1.3)}
for(j=0;j<placed.length;j++){var P=placed[j];m=Math.min(m,Math.max(Math.abs(p[0]-P.cx)-P.w/2,Math.abs(p[1]-P.cy)-P.h/2))}}
m+=(a>-2.4&&a<-0.6?1.5:0);/* à égalité : de préférence en haut */
if(m>best){best=m;ba=a}}
res.push(ba);placed.push(tagBox(it.x,it.y,r,it.code,ba))}return res}
/* circuit en ligne : ▲ — ① — ② … — ◎ ; code dessous ; temps sous le code */
function seqSVG(codes,o){o=o||{};var r=o.r||14,step=o.step||(r*4.4),pad=r*1.6,y=r*1.9,times=o.times,tb=o.notag?{y:y,h:r*(o.sub?2.3:1.1)}:tagBox(0,y,r,'00','below'),h=tb.y+tb.h+(times?r*1.5:r*0.4),n=codes.length,W=pad*2+step*(n+1),g='';
var xs=[pad];for(var i=0;i<n;i++)xs.push(pad+step*(i+1));xs.push(pad+step*(n+1));
for(i=0;i<xs.length-1;i++)g+=svgTrait([xs[i],y],[xs[i+1],y],r*1.15,r*1.15);
g+=svgDepart(xs[0],y,r*1.08,null,[xs[1],y]);
var ty=tb.y+tb.h+r*1.05;
for(i=0;i<n;i++){var miss=o.miss&&o.miss.indexOf(i)>=0;g+='<g'+(o.click?' style="cursor:pointer" onclick="'+o.click+'('+i+')"':'')+'>'+svgPoste(xs[i+1],y,i+1,o.notag?null:codes[i],{r:r,sel:o.sel===i,miss:miss,pos:'below',tagClick:o.tagClick?o.tagClick+'('+i+')':null,edit:o.ed===i?o.edv:null})+'</g>';
if(o.sub&&o.sub[i]!==undefined)g+='<text x="'+xs[i+1]+'" y="'+(y+r*2.25)+'" text-anchor="middle" font-size="'+Math.round(r*0.8)+'" font-weight="700" fill="#D92D20">'+o.sub[i]+'</text>';
if(times)g+='<text x="'+xs[i+1]+'" y="'+ty+'" text-anchor="middle" font-size="'+Math.round(Math.max(9,r*0.8))+'" font-weight="'+(miss?700:500)+'" fill="'+(miss?'#D92D20':'#4A5D52')+'">'+(miss?'manque':times[i])+'</text>'}
g+=svgArrivee(xs[n+1],y,r);if(times&&o.finish)g+='<text x="'+xs[n+1]+'" y="'+ty+'" text-anchor="middle" font-size="'+Math.round(Math.max(9,r*0.8))+'" font-weight="700" fill="#163628">'+o.finish+'</text>';
return '<svg viewBox="0 0 '+W+' '+h+'" width="'+(o.width||W)+'" style="display:block;max-width:100%;overflow:visible">'+g+'</svg>'}
/* circuit en colonne : code à droite du rond ; temps encore à droite (optionnel) */
function colSVG(codes,o){o=o||{};var r=o.r||13,step=o.step||(r*3.3),x=r*1.6,times=o.times,n=codes.length,tx=x+r*5.4,W=times?tx+r*4.5:x+r*5,top=r*1.6,H=top*2+step*(n+1),g='';
var ys=[top];for(var i=0;i<n;i++)ys.push(top+step*(i+1));ys.push(top+step*(n+1));
for(i=0;i<ys.length-1;i++)g+=svgTrait([x,ys[i]],[x,ys[i+1]],r*1.15,r*1.15);
g+=svgDepart(x,ys[0],r*1.08,null,[x,ys[1]]);
var fs=Math.round(Math.max(9,r*0.85));
for(i=0;i<n;i++){var miss=o.miss&&o.miss.indexOf(i)>=0;g+='<g'+(o.click?' style="cursor:pointer" onclick="'+o.click+'('+i+')"':'')+'>'+svgPoste(x,ys[i+1],i+1,codes[i],{r:r,sel:o.sel===i,miss:miss,pos:'right',tagClick:o.tagClick?o.tagClick+'('+i+')':null,edit:o.ed===i?o.edv:null})+'</g>';
if(times)g+='<text x="'+(W-2)+'" y="'+(ys[i+1]+fs*0.36)+'" text-anchor="end" font-size="'+fs+'" font-weight="'+(miss?700:500)+'" fill="'+(miss?'#D92D20':'#4A5D52')+'">'+(miss?'manque':times[i])+'</text>'}
g+=svgArrivee(x,ys[n+1],r);if(times&&o.finish)g+='<text x="'+(W-2)+'" y="'+(ys[n+1]+fs*0.36)+'" text-anchor="end" font-size="'+fs+'" font-weight="700" fill="#163628">'+o.finish+'</text>';
return '<svg viewBox="0 0 '+W+' '+H+'" width="'+(o.width||W)+'" style="display:block;overflow:visible">'+g+'</svg>'}
/* carte complète d'un circuit : pts = [départ, postes…, arrivée], codes, libres = [[x,y,code]] */
function mapPostes(D,P,A,codes,o){o=o||{};var r=o.r||13,g='',pts=[D].concat(P).concat([A]),segs=[];
for(var i=0;i<pts.length-1;i++){segs.push([pts[i],pts[i+1]]);g+=svgTrait(pts[i],pts[i+1],i===0?r*1.45:r*1.1,i===pts.length-2?r*1.25:r*1.1)}
var lib=o.libres||[],items=[];for(i=0;i<P.length;i++)items.push({x:P[i][0],y:P[i][1],code:codes[i]});
for(i=0;i<lib.length;i++)items.push({x:lib[i][0],y:lib[i][1],code:lib[i][2]});
var ang=placeTags(items,segs,r,[D,A]);
for(i=0;i<lib.length;i++){var j=P.length+i;g+='<g'+(o.click?' class="ctrl" onclick="'+o.click+'('+lib[i][2]+')"':'')+'>'+svgPoste(lib[i][0],lib[i][1],null,lib[i][2],{libre:true,r:r*0.92,pos:ang[j]})+'</g>'}
for(i=0;i<P.length;i++)g+='<g'+(o.click?' class="ctrl" onclick="'+o.click+'('+codes[i]+')"':'')+'>'+svgPoste(P[i][0],P[i][1],i+1,codes[i],{r:r,sel:o.sel===i,pos:ang[i],tagClick:o.tagClick?o.tagClick+'('+i+')':null,edit:o.ed===i?o.edv:null})+'</g>';
g+=svgDepart(D[0],D[1],r*1.3,null,P.length?P[0]:A)+svgArrivee(A[0],A[1],r*1.15);return g}
var codes=[31,45,52,64,38,70,82],T=['4:10','9:32','14:05','19:48','25:40','31:12','38:51'];
var TGT=function(sz,fast){return '<span style="position:relative;display:inline-flex;width:'+sz+'px;height:'+sz+'px"><span class="wave" style="animation-duration:'+(fast?'.9s':'2.4s')+'"></span><svg viewBox="0 0 52 52" width="'+sz+'" height="'+sz+'" style="position:relative"><circle cx="26" cy="26" r="17" fill="none" stroke="#7EE0A6" stroke-width="4"/><circle cx="26" cy="26" r="9" fill="none" stroke="#7EE0A6" stroke-width="4"/></svg></span>'};

var rk='';if(full&&!pm){var R=[['1','DUMAS Lise','46:07'],['2','GIRAUD Ana','47:30'],['3','MARTIN Léa','48:12',1],['4','LEROY Zoé','51:03'],['5','BRUN Elsa','52:44']];for(var i=0;i<R.length;i++){var me=R[i][3];rk+='<div style="display:flex;align-items:center;gap:14px;font-size:24px;padding:7px 12px;border-radius:10px;'+(me?'background:#3DDC97;color:#163628;font-weight:700':'')+'"><span style="width:28px;text-align:right;opacity:'+(me?1:.7)+'">'+R[i][0]+'</span><span style="flex:1">'+R[i][1]+'</span><span style="font-variant-numeric:tabular-nums">'+R[i][2]+'</span></div>'}

/* ---------- Découverte ---------- */
