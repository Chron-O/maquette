<!doctype html>
<!-- The page around the web version: one canvas, filled by Slint. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chron'O — maquette</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F5F8F4; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1A14; } }
    /* !important: Slint writes its preferred size on the canvas; the browser window must win. */
    canvas { display: block; width: 100vw !important; height: 100dvh !important; outline: none; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import init from "./pkg/maquette.js";
    init();
  </script>
</body>
</html>
